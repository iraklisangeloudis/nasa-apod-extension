<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>NASA APOD Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <p class="eyebrow">Discover the cosmos</p>
    <h1>Astronomy Picture of the Day</h1>
    <button id="theme-toggle" type="button" data-mode="system">
      <svg class="theme-icon icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4m-4 0h8"/></svg>
      <svg class="theme-icon icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg class="theme-icon icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
      <span id="theme-label">Theme: System</span>
    </button>
  </header>
  <p id="status" role="status" aria-live="polite">Loading the cosmos…</p>
  <button id="retry" type="button" hidden>Try again</button>
  <main id="apod-content" hidden>
    <div id="apod-media"></div>
    <div class="details">
      <p id="apod-date" class="eyebrow"></p>
      <h2 id="apod-title"></h2>
      <div id="apod-description"></div>
      <div id="apod-credit" class="credit"></div>
      <a id="apod-source" target="_blank" rel="noopener noreferrer">View on NASA ↗</a>
    </div>
  </main>
  <footer>An unofficial viewer of NASA’s APOD.</footer>
</body>
</html>
